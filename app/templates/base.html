<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1018">
  <title>{% block title %}OptionFlow{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top-bar">
    <h1>{% block header %}OptionFlow{% endblock %}</h1>
    {% block subheader %}{% endblock %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <nav class="bottom-nav" aria-label="ناوبری">
    <a href="/" class="{% if active == 'home' %}active{% endif %}">
      <span class="icon">⌂</span>
      <span>خانه</span>
    </a>
    <a href="/reports" class="{% if active == 'reports' %}active{% endif %}">
      <span class="icon">☰</span>
      <span>گزارش‌ها</span>
    </a>
    <a href="/telegram" class="{% if active == 'telegram' %}active{% endif %}">
      <span class="icon">✈</span>
      <span>تلگرام</span>
    </a>
  </nav>
</body>
</html>
