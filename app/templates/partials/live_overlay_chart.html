{% if chart_payload and chart_payload.candles %}
<figure class="scenario-chart pattern-chart" aria-label="چارت زنده BTCUSDT">
  <div class="live-ov-chart-wrap">
    <div class="live-ov-chart-toolbar" role="toolbar" aria-label="ابزار چارت">
      <button
        type="button"
        class="live-ov-measure-btn"
        data-measure-for="{{ chart_payload_id }}"
        data-draw-mode="measure"
        aria-pressed="false"
        title="دو نقطه روی چارت — فاصله قیمت و درصد"
      >
        <span class="live-ov-measure-icon" aria-hidden="true">📏</span>
        Measure
      </button>
      <output class="live-ov-measure-readout" for="{{ chart_payload_id }}" aria-live="polite"></output>
    </div>
    <div class="scenario-chart-frame">
      <div class="live-ov-chart-inner">
        <div
          class="live-ov-chart-mount"
          data-live-overlay-chart
          data-payload-id="{{ chart_payload_id }}"
          {% if chart_levels_only %}data-levels-only="1"{% endif %}
          {% if chart_poll_url %}data-poll-url="{{ chart_poll_url }}"{% endif %}
        ></div>
        <div class="live-ov-measure-layer" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script type="application/json" id="{{ chart_payload_id }}">{{ chart_payload_json|safe }}</script>
</figure>
{% elif chart_png_src %}
<figure class="scenario-chart pattern-chart">
  <div class="scenario-chart-frame">
    <img
      class="chart-preview"
      src="{{ chart_png_src }}"
      alt="{{ chart_png_alt|default('چارت الگو') }}"
      loading="lazy"
    />
  </div>
</figure>
{% endif %}
