<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <title>{% block title %}ورود — OptionFlow{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=5">
  <link rel="stylesheet" href="/static/auth-login.css?v=1">
</head>
<body class="auth-login-page">
  <div class="auth-login-bg" aria-hidden="true">
    <div class="auth-login-bg-glow"></div>
    <div class="auth-login-bg-chart"></div>
    <div class="auth-login-bg-mountains"></div>
  </div>

  <div class="auth-login-shell">
    <header class="auth-login-brand">
      {% include "auth_logo.html" %}
      <p class="auth-login-tagline">{% block tagline %}تحلیل، تصمیم، سود{% endblock %}</p>
      {% block brand_extra %}{% endblock %}
    </header>

    <div class="auth-login-card">
      <h1 class="auth-login-title">{% block form_title %}ورود{% endblock %}</h1>
      {% block form_subtitle %}{% endblock %}
      {% block content %}{% endblock %}
    </div>

    <footer class="auth-login-foot">
      {% block footer %}{% endblock %}
    </footer>
  </div>
</body>
</html>
