{% extends "base.html" %}
{% block title %}تغییر رمز — OptionFlow{% endblock %}
{% block header %}تغییر رمز عبور{% endblock %}

{% block content %}
<p class="muted">اولین ورود — لطفاً رمز جدید انتخاب کنید (حداقل ۸ کاراکتر).</p>
{% if error %}
<p class="flash err">{{ error }}</p>
{% endif %}
<form class="filter-card auth-form" method="post" action="/change-password">
  <label>رمز جدید</label>
  <input name="password" type="password" required minlength="8" autocomplete="new-password">
  <label>تکرار رمز</label>
  <input name="password2" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit" class="btn primary full">ذخیره</button>
</form>
{% endblock %}
