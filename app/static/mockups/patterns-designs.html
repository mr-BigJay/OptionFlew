<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طرح‌های منوی الگو — OptionFlow</title>
  <style>
    :root { --bg:#0a1018; --surface2:#1a2433; --text:#eef2f6; --muted:#8b98a8; --accent:#22d3ee; }
    body { margin:0; padding:16px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); max-width:900px; margin-inline:auto; }
    h1 { font-size:1.1rem; }
    .muted { color:var(--muted); font-size:0.85rem; }
    section { margin:28px 0; padding:16px; border:1px solid #2a3441; border-radius:16px; background:#121a26; }
    h2 { font-size:0.95rem; margin:0 0 12px; color:var(--accent); }
    .sample { display:flex; flex-direction:column; gap:10px; }
    .sample.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .sample.compact { gap:6px; }
    a.item { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--surface2); border:1px solid #2a3441; border-radius:12px; color:var(--text); text-decoration:none; }
    .sample.compact a.item { padding:10px 14px; }
    .sample.grid a.item { flex-direction:column; align-items:flex-start; min-height:64px; }
  </style>
</head>
<body>
  <h1>۳ طرح منوی الگوها</h1>
  <p class="muted">در اپ: <code>/patterns?layout=cards|grid|compact</code></p>

  <section>
    <h2>۱ — کارت عمودی (پیشنهاد پیش‌فرض)</h2>
    <div class="sample">
      <a class="item" href="#"><span>رفتار معنادار</span><span>‹</span></a>
      <a class="item" href="#"><span>واگرایی RSI</span><span>‹</span></a>
      <a class="item" href="#"><span>ترندلاین</span><span>‹</span></a>
    </div>
  </section>

  <section>
    <h2>۲ — شبکه دو ستونه (موبایل)</h2>
    <div class="sample grid">
      <a class="item" href="#"><span>مثلث فشرده</span><span>‹</span></a>
      <a class="item" href="#"><span>الگوی پرچم</span><span>‹</span></a>
      <a class="item" href="#"><span>EMA50</span><span>‹</span></a>
      <a class="item" href="#"><span>کانال</span><span>‹</span></a>
    </div>
  </section>

  <section>
    <h2>۳ — فشرده (لیست کوتاه)</h2>
    <div class="sample compact">
      <a class="item" href="#"><span>مثلث فشرده</span><span>‹</span></a>
      <a class="item" href="#"><span>رفتار معنادار</span><span>‹</span></a>
    </div>
  </section>
</body>
</html>
